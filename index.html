<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MachCrash</title>
    <meta name="theme-color" content="#0f2537" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MachCrash" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="static/icons/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <header class="hud">
      <p id="status-msg" class="status">Your turn – pick a category!</p>
    </header>

    <main class="arena">
      <div class="scoreboard">
        <span>You: <strong id="player-count">16</strong></span>
        <span>Pot: <strong id="pot-count">0</strong></span>
        <span>CPU: <strong id="opponent-count">16</strong></span>
      </div>
      <div class="slots">
        <section class="slot">
          <div id="player-card-container"></div>
        </section>

        <section class="slot">
          <div id="opponent-card-container" class="card-hidden"></div>
        </section>
      </div>
      <nav class="controls">
        <button id="next-round-btn" hidden>Next round ▶</button>
        <button id="stats-btn">Balancing stats (console)</button>
      </nav>
    </main>

    <footer>
    </footer>

    <div id="rotate-overlay" class="rotate-overlay">
      <p>Please rotate your device</p>
    </div>

    <div id="game-overlay" class="game-overlay">
      <p id="game-overlay-msg"></p>
      <button type="button" id="try-again-btn">Play again</button>
    </div>

    <script type="module" src="libs/ui.js"></script>
  </body>
</html>
